<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fit2Go | Trainerize Update Request</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --fit2go-green: #04800c;
      --fit2go-dark: #0d2b0f;
      --fit2go-cream: #f7fbf5;
      --text-primary: #0f2414;
      --text-secondary: #3c5640;
      --shadow: 0 18px 40px rgba(4, 128, 12, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(4, 128, 12, 0.08), transparent 30%),
                  radial-gradient(circle at 80% 0%, rgba(4, 128, 12, 0.12), transparent 35%),
                  var(--fit2go-cream);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: var(--shadow);
      max-width: 780px;
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(4, 128, 12, 0.08);
    }

    .card__header {
      background: linear-gradient(135deg, var(--fit2go-green), #0db317);
      color: #fff;
      padding: 28px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .card__header img {
      height: 56px;
      width: auto;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.2));
    }

    .card__title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
    }

    .card__subtitle {
      opacity: 0.9;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    form {
      padding: 28px 32px 36px;
      display: grid;
      gap: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .input, textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(4, 128, 12, 0.2);
      border-radius: 10px;
      background: #f9fbf9;
      font-size: 1rem;
      color: var(--text-secondary);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .input:focus, textarea:focus {
      border-color: var(--fit2go-green);
      outline: none;
      box-shadow: 0 0 0 3px rgba(4, 128, 12, 0.12);
      background: #fff;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }

    .helper-text {
      color: var(--text-secondary);
      font-size: 0.88rem;
      margin-top: 6px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 6px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 14px 22px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.1s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn--ghost {
      background: #f2f7f2;
      color: var(--text-secondary);
    }

    .btn--primary {
      background: var(--fit2go-green);
      color: #fff;
      box-shadow: 0 12px 24px rgba(4, 128, 12, 0.25);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    @media (max-width: 640px) {
      body {
        padding: 24px 12px;
      }

      .card__header {
        flex-direction: column;
        align-items: flex-start;
      }

      .card__title {
        font-size: 1.35rem;
      }

      form {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="card-title">
    <header class="card__header">
      <img src="Fit2Go Logo (Transparent BG).png" alt="Fit2Go logo">
      <div>
        <div class="card__title" id="card-title">Trainerize Update Request</div>
        <div class="card__subtitle">Submit changes for client programs, billing, or session expirations</div>
      </div>
    </header>

    <form>
      <div>
        <label for="trainer-name">Trainer name</label>
        <input class="input" id="trainer-name" name="trainer-name" type="text" placeholder="e.g., Jordan Smith" required>
      </div>

      <div>
        <label for="problem">1) The problem</label>
        <textarea id="problem" name="problem" placeholder="Describe the client issue or blocker" required></textarea>
      </div>

      <div>
        <label for="proposed-solution">2) The proposed solution</label>
        <textarea id="proposed-solution" name="proposed-solution" placeholder="Share your preferred resolution or options" required></textarea>
      </div>

      <div>
        <label for="exact-action">3) The exact action requested by Fit2Go admin</label>
        <textarea id="exact-action" name="exact-action" placeholder="List the precise steps to take in Trainerize or billing" required></textarea>
        <p class="helper-text">Be explicit: include client name, program names, billing dates, or session counts needed.</p>
      </div>

      <div class="actions">
        <button type="reset" class="btn btn--ghost">Clear</button>
        <button type="submit" class="btn btn--primary">Submit request</button>
      </div>
    </form>
  </main>
</body>
</html>
