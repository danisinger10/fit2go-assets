<style>
/* CSS Reset and Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --fit2go-dark-green: #14880C;
    --fit2go-light-green: #09D200;
    --fit2go-white: #FFFFFF;
    --fit2go-black: #000000;
    --text-primary: #1a1a1a;
    --text-secondary: #4a4a4a;
    --bg-light-gray: #f8f9fa;
    --bg-dark: #111111;
    --accent-gold: #D4AF37;
    --font-heading: 'Playfair Display', serif;
    --font-body: 'Inter', sans-serif;
}

html {
    scroll-behavior: smooth;
    max-width: 100%;
    overflow-x: hidden;
}

body {
    font-family: var(--font-body);
    color: var(--text-primary);
    line-height: 1.7;
    font-weight: 400;
    background: var(--fit2go-white);
    max-width: 100%;
    overflow-x: hidden;
}

img {
    max-width: 100%;
    height: auto;
    display: block;
}

/* Typography */
h1, h2, h3, h4 {
    font-family: var(--font-heading);
    font-weight: 700;
    line-height: 1.3;
    color: var(--fit2go-black);
}

h1 {
    font-size: 3.5rem;
    letter-spacing: -0.02em;
    margin-bottom: 1.5rem;
}

h2 {
    font-size: 2.75rem;
    margin-bottom: 1.5rem;
    text-align: center;
}

h3 {
    font-size: 1.875rem;
    margin-bottom: 1rem;
}

p {
    font-size: 1.125rem;
    line-height: 1.8;
    color: var(--text-secondary);
    margin-bottom: 1.5rem;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
}


/* Navigation */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(0, 0, 0, 0.75);
    z-index: 1000;
    padding: 20px 0;
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
}

.nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nav-brand {
    display: flex;
    align-items: center;
}

.nav-logo {
    height: 50px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
}

.hamburger {
    display: none;
    flex-direction: column;
    gap: 6px;
    width: 30px;
    cursor: pointer;
    background: none;
    border: none;
}

.hamburger span {
    height: 3px;
    width: 100%;
    background: var(--fit2go-black);
    display: block;
}

.nav-menu {
    display: flex;
    list-style: none;
    align-items: center;
    gap: 35px;
}

.nav-link {
    color: var(--fit2go-white);
    text-decoration: none;
    font-weight: 500;
    font-size: 0.95rem;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    transition: color 0.3s ease;
}

.nav-link:hover {
    color: var(--fit2go-light-green);
}

/* Buttons */
.btn {
    display: inline-block;
    padding: 16px 36px;
    text-decoration: none;
    font-weight: 600;
    letter-spacing: 0.02em;
    transition: all 0.3s ease;
    cursor: pointer;
    border: none;
    font-size: 0.95rem;
    text-transform: uppercase;
    border-radius: 50px;
    text-align: center;
}

.btn-primary {
    background: var(--fit2go-dark-green);
    color: var(--fit2go-white);
}

.btn-primary:hover {
    background: var(--fit2go-light-green);
    transform: scale(1.03);
    box-shadow: 0 0 8px #09D20080;
}

.btn-outline {
    background: transparent;
    color: var(--fit2go-dark-green);
    border: 2px solid var(--fit2go-dark-green);
}

.btn-outline:hover {
    background: var(--fit2go-dark-green);
    color: var(--fit2go-white);
}

.btn-white {
    background: var(--fit2go-white);
    color: var(--fit2go-dark-green);
    font-weight: 700;
}

/* Hero Section */
.hero {
    min-height: 85vh;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    color: var(--fit2go-white);
    padding: 0 0 80px;
}

.hero::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('https://www.fit2gopt.com/wp-content/uploads/2025/10/Kemp-Mill-Personal-Training-Image-5-scaled.png') top center/cover no-repeat;
    z-index: 0;
    animation: heroKenBurns 20s ease-in-out infinite;
    transform-origin: center;
}

.hero-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65));
    z-index: 1;
}

.hero-content {
    position: relative;
    z-index: 2;
    max-width: 800px;
    text-align: center;
    margin: 0 auto;
    padding-top: 120px;
}


.hero h1 {
    color: var(--fit2go-white);
    font-weight: 900;
    text-shadow: 0 3px 3px var(--fit2go-black);
    font-size: 3.5rem;
    line-height: 1.2;
    margin-top: 40px;
    margin-bottom: 3rem;
    letter-spacing: 0.02em;
}

.hero-subtitle {
    font-size: 1.5rem;
    line-height: 1.6;
    margin-bottom: 5rem;
    color: var(--fit2go-white);
    max-width: 60ch;
    margin-left: auto;
    margin-right: auto;
}

.hero-cta {
    margin-bottom: 4rem;
}

.btn-large {
    font-size: 1.1rem;
    padding: 20px 50px;
    font-weight: 700;
}

.cta-subtext {
    margin-top: 1rem;
    font-size: 0.95rem;
    color: rgba(255,255,255,0.9);
}

.hero-scroll-indicator {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2rem;
    color: var(--fit2go-white);
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 20%, 50%, 80%, 100% {
        transform: translateX(-50%) translateY(0);
    }
    40% {
        transform: translateX(-50%) translateY(-10px);
    }
    60% {
        transform: translateX(-50%) translateY(-5px);
    }
}

@keyframes heroKenBurns {
    from { transform: scale(1); }
    to { transform: scale(1.1); }
}

.hero-bullets {
    list-style: none;
    display: grid;
    gap: 12px;
    margin: 0 auto 3rem;
    max-width: 540px;
    text-align: left;
}

.hero-bullets li {
    position: relative;
    padding-left: 28px;
    font-size: 1.1rem;
    color: var(--fit2go-white);
}

.hero-bullets li::before {
    content: '\f00c';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    position: absolute;
    left: 0;
    top: 0;
    color: var(--fit2go-light-green);
}

.section-light {
    background: var(--fit2go-white);
}

.secondary-cta {
    display: inline-block;
    margin-top: 20px;
    font-weight: 600;
    color: var(--fit2go-dark-green);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    padding-bottom: 4px;
    transition: color 0.3s ease, border-color 0.3s ease;
}

.secondary-cta:hover {
    color: var(--fit2go-light-green);
    border-color: var(--fit2go-light-green);
}

.secondary-cta-light {
    color: var(--fit2go-white);
    border-color: rgba(255,255,255,0.4);
}

.secondary-cta-light:hover {
    border-color: var(--fit2go-light-green);
}

.community-card {
    background: var(--bg-light-gray);
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.community-card h3 {
    margin-bottom: 1rem;
}

.community-list {
    list-style: none;
    display: grid;
    gap: 10px;
    font-size: 1rem;
    color: var(--text-secondary);
    padding-left: 0;
}

.community-list li::before {
    content: '\2022';
    color: var(--fit2go-light-green);
    font-weight: bold;
    display: inline-block;
    width: 1em;
    margin-left: -1em;
}

.checklist {
    list-style: none;
    margin: 1.5rem 0;
    padding: 0;
}

.checklist li {
    padding-left: 28px;
    position: relative;
    margin-bottom: 12px;
}

.checklist li::before {
    content: '\f14a';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    position: absolute;
    left: 0;
    top: 0;
    color: var(--fit2go-dark-green);
}

.section-cta {
    text-align: center;
    margin-top: 40px;
}

.nutrition-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
    margin-top: 40px;
}

.nutrition-card {
    background: var(--fit2go-white);
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.contact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 30px;
    margin-top: 50px;
}

.contact-card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 30px;
    text-align: center;
}

.contact-card h3 {
    color: var(--fit2go-light-green);
}

.contact-highlight a {
    color: var(--fit2go-white);
    font-size: 1.6rem;
    font-weight: 700;
    text-decoration: none;
}

.contact-highlight a:hover {
    color: var(--fit2go-light-green);
}

.service-area-note {
    margin-top: 40px;
    text-align: center;
    color: rgba(255,255,255,0.8);
}

.mobile-cta-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: var(--fit2go-dark-green);
    padding: 12px 20px;
    display: none;
    z-index: 1000;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
}

.mobile-cta-button {
    display: block;
    text-align: center;
    color: var(--fit2go-white);
    font-weight: 700;
    text-decoration: none;
}

.faq-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 40px;
}

.faq-item {
    border: 1px solid #e1e1e1;
    border-radius: 10px;
    overflow: hidden;
    background: var(--fit2go-white);
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

.faq-question {
    width: 100%;
    text-align: left;
    padding: 18px 24px;
    font-size: 1.1rem;
    font-weight: 600;
    background: none;
    border: none;
    cursor: pointer;
}

.faq-answer {
    display: none;
    padding: 0 24px 24px;
}

.faq-question[aria-expanded="true"] + .faq-answer {
    display: block;
}

@media (max-width: 768px) {
    body {
        padding-bottom: 80px;
    }
    .hero-bullets {
        margin-bottom: 2rem;
    }
    .community-card {
        padding: 30px;
    }
    .mobile-cta-bar {
        display: block;
    }
}

/* Stats Bar */
.stats-bar {
    background: linear-gradient(135deg, var(--fit2go-dark-green), #000);
    padding: 40px 0;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    color: var(--fit2go-white);
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px;
    text-align: center;
}

.stats-bar .stat-item {
    padding: 0;
}

.stats-bar .stat-number {
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--accent-gold);
    font-family: var(--font-heading);
    margin-bottom: 0.5rem;
}

.stats-bar .stat-label {
    font-size: 0.875rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--fit2go-white);
}

/* Value Props */
.value-props {
    background: var(--fit2go-white);
    padding: 60px 0;
    margin-top: -40px;
    position: relative;
    z-index: 10;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.1);
    border-radius: 20px 20px 0 0;
}

.value-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 40px;
    text-align: center;
}

.value-item {
    padding: 30px 20px;
}

.value-icon {
    font-size: 3rem;
    margin-bottom: 20px;
}

.premium-icon {
    color: var(--accent-gold);
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

.value-item h4 {
    font-size: 1.25rem;
    margin-bottom: 0.75rem;
    color: var(--fit2go-black);
}

.value-item p {
    font-size: 1rem;
    margin-bottom: 0;
}

/* Section Styles */
section {
    padding: 100px 0;
    overflow-x: hidden;
}

.section-gray {
    background: var(--bg-light-gray);
}

.section-dark {
    background: var(--bg-dark);
    color: var(--fit2go-white);
}

.section-dark h2,
.section-dark h3,
.section-dark h4,
.section-dark p,
.section-dark li {
    color: var(--fit2go-white);
}

.section-dark .btn-outline {
    color: var(--fit2go-white);
    border-color: var(--fit2go-white);
}

/* Ensure card content remains legible on dark sections */
.section-dark .team-member,
.section-dark .pricing-card {
    background: var(--fit2go-white);
    color: var(--text-secondary);
}

.section-dark .team-member h3,
.section-dark .pricing-card h3 {
    color: var(--text-primary);
}

.section-dark .team-member p,
.section-dark .team-member li,
.section-dark .pricing-card p,
.section-dark .pricing-card li {
    color: var(--text-secondary);
}

.section-green {
    background: linear-gradient(135deg, #0b3d02, var(--fit2go-dark-green));
    color: var(--fit2go-white);
}

.section-green h2,
.section-green h3,
.section-green h4,
.section-green p,
.section-green li {
    color: var(--fit2go-white);
}

.section-green .btn-outline {
    color: var(--fit2go-white);
    border-color: var(--fit2go-white);
}

/* Ensure cards remain readable on green sections */
.section-green .service-card {
    background: var(--fit2go-white);
    color: var(--text-secondary);
}

.section-green .service-card h3 {
    color: var(--text-primary);
}

.section-green .service-card p,
.section-green .service-card li {
    color: var(--text-secondary);
}

/* About Section */
.about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
    margin-top: 60px;
}

.about-content h3 {
    color: var(--accent-gold);
    margin-bottom: 1.5rem;
}

.about-image img {
    width: 100%;
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
}

/* Process Steps */
.process-timeline {
    max-width: 1000px;
    margin: 60px auto 0;
}

.process-step {
    display: flex;
    align-items: flex-start;
    margin-bottom: 60px;
    opacity: 1;
}

.step-number {
    background: var(--fit2go-dark-green);
    color: var(--fit2go-white);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.5rem;
    flex-shrink: 0;
    font-family: var(--font-heading);
}

.step-content {
    margin-left: 40px;
    flex: 1;
}

.step-duration {
    color: var(--fit2go-dark-green);
    font-weight: 600;
    font-size: 0.875rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 1rem;
}

/* Service Cards */
.services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
    margin-top: 60px;
}

.service-card {
    background: var(--fit2go-white);
    padding: 50px 40px;
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    transition: all 0.3s ease;
    position: relative;
}

.service-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.12);
}

.service-card.featured {
    background: var(--fit2go-dark-green);
    color: var(--fit2go-white);
}

.service-card.featured h3,
.service-card.featured p,
.service-card.featured li {
    color: var(--fit2go-white);
}

.service-card ul {
    list-style: none;
    margin-top: 20px;
}

.service-card li {
    padding: 10px 0;
    padding-left: 28px;
    position: relative;
}

.service-card li::before {
    content: '✓';
    position: absolute;
    left: 0;
    color: var(--fit2go-light-green);
    font-weight: bold;
    font-size: 1.2rem;
}

/* Team Section */
.team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 50px;
    margin-top: 60px;
}

.team-member {
    background: var(--fit2go-white);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
}

.team-member img {
    width: 100%;
    height: 350px;
    object-fit: cover;
}

.team-member-info {
    padding: 40px;
}

.team-title {
    color: var(--accent-gold);
    font-weight: 600;
    margin-bottom: 1.5rem;
}

.team-credentials {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
}

.credential {
    background: var(--fit2go-dark-green);
    color: var(--fit2go-white);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
}

/* Testimonials */
.testimonial-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 40px;
    margin-top: 60px;
}

.testimonial-card {
    background: var(--bg-light-gray);
    padding: 40px;
    border-radius: 10px;
}

.testimonial-stars {
    color: #FFD700;
    font-size: 1.3rem;
    margin-bottom: 20px;
}

.testimonial-text {
    font-size: 1.125rem;
    line-height: 1.8;
    color: var(--text-primary);
    margin-bottom: 25px;
    font-style: italic;
}

.testimonial-author {
    font-weight: 700;
    color: var(--fit2go-dark-green);
}

.testimonial-location {
    color: var(--text-secondary);
    font-size: 0.9rem;
}

/* Pricing */
.pricing-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
    max-width: 1100px;
    margin: 0 auto;
}

.pricing-card {
    background: var(--fit2go-white);
    padding: 50px 40px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    position: relative;
    display: flex;
    flex-direction: column;
}

.pricing-card .pricing-features {
    flex-grow: 1;
}

.pricing-card.featured {
    transform: scale(1.05);
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
}

.price {
    font-size: 2.5rem;
    font-weight: 800;
    color: var(--fit2go-dark-green);
    margin: 20px 0 5px;
    font-family: var(--font-heading);
}

.price-original {
    font-size: 1.25rem;
    text-decoration: line-through;
    color: var(--text-secondary);
    opacity: 0.7;
    margin-top: 20px;
    margin-bottom: -5px;
}

.price-note {
    font-size: 0.9rem;
    color: var(--text-secondary);
    margin-bottom: 30px;
}

.pricing-features {
    list-style: none;
    text-align: left;
    margin-bottom: 30px;
}

.pricing-features li {
    padding: 10px 0;
    padding-left: 25px;
    position: relative;
}

<script>
document.addEventListener('DOMContentLoaded', () => {
    const hamburger = document.querySelector('.hamburger');
    const navMenu = document.getElementById('primary-navigation');

    if (hamburger && navMenu) {
        hamburger.addEventListener('click', () => {
            const expanded = hamburger.getAttribute('aria-expanded') === 'true';
            hamburger.setAttribute('aria-expanded', String(!expanded));
            navMenu.classList.toggle('active');
        });

        navMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('active');
                hamburger.setAttribute('aria-expanded', 'false');
            });
        });
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', event => {
            const targetId = anchor.getAttribute('href');
            if (targetId && targetId.length > 1) {
                const target = document.querySelector(targetId);
                if (target) {
                    event.preventDefault();
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            }
        });
    });

    document.querySelectorAll('.faq-question').forEach(button => {
        button.addEventListener('click', () => {
            const expanded = button.getAttribute('aria-expanded') === 'true';
            button.setAttribute('aria-expanded', String(!expanded));
        });
    });

    document.querySelectorAll('.cta-book').forEach(link => {
        link.addEventListener('click', () => {
            const location = link.getAttribute('data-cta-location') || 'cta';
            if (typeof gtag === 'function') {
                gtag('event', 'select_content', {
                    content_type: 'cta_click',
                    location
                });
            }
        });
    });
});
</script>
