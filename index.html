<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fit2Go Rockville Preview Redirect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Inter", Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #1a1a1a;
      text-align: center;
      padding: 2rem;
    }
    a {
      color: #14880C;
      font-weight: 600;
      text-decoration: none;
    }
    a:focus,
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <p>If you are not automatically redirected, please <a id="redirect-link" href="rockville.html">open the Fit2Go Rockville landing page</a>.</p>
  <script>
    (function () {
      var current = window.location;
      var target = current.origin + current.pathname.replace(/index\.html?$/, 'rockville.html');

      if (current.host === 'htmlpreview.github.io') {
        var query = current.search ? current.search.substring(1) : '';
        if (query) {
          var updated = query.replace(/index\.html?(?=$|[?#])/, 'rockville.html');
          target = current.origin + '/?' + (updated !== query ? updated : query + (query ? '&' : '') + 'file=rockville.html');
        } else {
          target = current.origin + '/?rockville.html';
        }
      }

      var link = document.getElementById('redirect-link');
      if (link) {
        link.setAttribute('href', target);
      }

      window.location.replace(target);
    })();
  </script>
</body>
</html>
